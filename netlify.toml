[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/submit-request"
  status = 200

[[redirects]]
  from = "/overview/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/modules"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/request"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
