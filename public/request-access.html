<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Live Demo — NS Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: rgba(18,18,24,0.65); --border: rgba(255,255,255,0.08);
      --text: #fff; --text2: #cbd5e1; --muted: #94a3b8; --accent: #38bdf8;
    }
    [data-theme="light"] {
      --bg: #f5f5f7; --card: rgba(255,255,255,0.82); --border: rgba(0,0,0,0.08);
      --text: #1d1d1f; --text2: #424245; --muted: #6e6e73;
    }
    body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 480px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: clamp(28px, 5vw, 44px); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo-glyph { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #818cf8); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 0.85rem; }
    .logo-text { font-weight: 800; font-size: 1.1rem; color: var(--text); }
    h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--text); font-family: inherit;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    [data-theme="light"] .field input, [data-theme="light"] .field textarea, [data-theme="light"] .field select { background: rgba(0,0,0,0.03); }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 100px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #2563eb);
      color: #fff; font-weight: 800; font-size: 0.95rem; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .back { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.85rem; font-weight: 600; text-decoration: none; margin-bottom: 28px; transition: color 0.2s; }
    .back:hover { color: var(--accent); }
    .theme-toggle { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
    .success { display: none; text-align: center; padding: 40px 0; }
    .success.show { display: block; }
    .success i { font-size: 3rem; color: #34d399; margin-bottom: 16px; display: block; }
    .success h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .success p { color: var(--muted); font-size: 0.9rem; }
    .form-content.hidden { display: none; }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><span id="themeIcon">&#9790;</span></button>

  <div class="card">
    <a href="index.html" class="back"><i class="bi bi-arrow-left"></i> Back to Command Center</a>

    <div class="logo">
      <div class="logo-glyph">NS</div>
      <span class="logo-text">Command Center</span>
    </div>

    <div id="formContent" class="form-content">
      <h1>Request Live Demo</h1>
      <p class="subtitle">Get full access to all 15 operational modules. Your request will be reviewed within 24 hours.</p>

      <form id="demoForm" onsubmit="handleSubmit(event)">
        <div class="field">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe" required />
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="john@company.com" required />
        </div>
        <div class="field">
          <label>Organization</label>
          <input type="text" placeholder="Company Name" />
        </div>
        <div class="field">
          <label>I am a...</label>
          <select>
            <option>Recruiter / Hiring Manager</option>
            <option>Developer / Engineer</option>
            <option>Student / Learner</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Message</label>
          <textarea placeholder="Tell us what you'd like to explore..."></textarea>
        </div>
        <button type="submit" class="btn">Submit Request <i class="bi bi-arrow-right" style="margin-left: 6px;"></i></button>
      </form>
    </div>

    <div id="successMsg" class="success">
      <i class="bi bi-check-circle-fill"></i>
      <h2>Request Submitted!</h2>
      <p>Thank you. We'll review your request and get back to you within 24 hours.</p>
      <a href="index.html" class="back" style="justify-content: center; margin-top: 20px;"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isLight = html.getAttribute("data-theme") === "light";
      html.setAttribute("data-theme", isLight ? "" : "light");
      document.getElementById("themeIcon").innerHTML = isLight ? "&#9790;" : "&#9728;";
    }
    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById("formContent").classList.add("hidden");
      document.getElementById("successMsg").classList.add("show");
    }
  </script>
</body>
</html>
